name: Deploy to Fly

on:
  push:
    branches:
      - main

concurrency:
  group: fly-manibot-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # Image the self-hosted server pulls (see README "Self-hosting").
  publish-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_VERSION=gh-${{ github.run_number }}
          tags: ghcr.io/manivela/manibot:latest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Check running state
        id: pre
        run: |
          RUNNING=$(flyctl machines list -a manibot --json | jq '[.[] | select(.state == "started")] | length')
          echo "running=$RUNNING" >> "$GITHUB_OUTPUT"
      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml --app manibot
      - name: Set release metadata
        run: |
          flyctl secrets set \
            RELEASE_VERSION="gh-${{ github.run_number }}" \
            GIT_SHA="${{ github.sha }}" \
            --app manibot
      - name: Restore scale-zero if app was down before deploy
        if: steps.pre.outputs.running == '0'
        run: |
          echo "App was scaled to zero before deploy — restoring that state"
          flyctl scale count 0 -a manibot -y
