# Ensures at least one Machine is running. Only calls `fly scale count 1` when no
# machines are already started — prevents accidentally scaling down a machine that
# came up via a deploy during the night window.
# Schedule: 08:00 Turkey (TRT, UTC+3) → 05:00 UTC. Change cron if you want a different wake time.
#
# Requires repo secret: FLY_API_TOKEN
#
# Manual run: Actions → “Fly — start manibot” → Run workflow

name: Fly — start manibot

on:
  schedule:
    - cron: "0 5 * * *" # 08:00 Turkey (UTC+3)
  workflow_dispatch:

concurrency:
  group: fly-manibot-start
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: manibot
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Scale to one (if not already running)
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "Missing FLY_API_TOKEN secret"
            exit 1
          fi
          RUNNING=$(flyctl machines list -a "$FLY_APP" --json | jq '[.[] | select(.state == "started")] | length')
          if [ "$RUNNING" -gt 0 ]; then
            echo "Already $RUNNING machine(s) running — skipping scale up"
          else
            flyctl scale count 1 -a "$FLY_APP" -y
          fi
